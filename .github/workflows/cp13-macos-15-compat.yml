name: CP13 macOS 15.7 compatibility

on:
  push:
    branches:
      - codex/road-v04-cp13
    paths:
      - .github/workflows/cp13-macos-15-compat.yml
      - .node-version
      - .python-version
      - requirements-build.lock
      - rust-toolchain.toml
      - frontend/**
      - scripts/build_sidecar.py
      - scripts/sidecar_entry.py
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and launch on macOS 15.7 arm64
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Verify runner and locked toolchains
        shell: bash
        run: |
          actual_version="$(sw_vers -productVersion)"
          case "$actual_version" in
            15.7*) ;;
            *)
              echo "::error::Expected macOS 15.7.x, got $actual_version"
              exit 1
              ;;
          esac
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::Expected arm64, got $(uname -m)"
            exit 1
          fi
          sw_vers
          uname -m
          node --version
          npm --version
          rustc --version
          cargo --version
          python --version

      - name: Install locked build dependencies
        shell: bash
        run: |
          npm --prefix frontend ci
          python -m pip install --disable-pip-version-check --requirement requirements-build.lock
          python -m PyInstaller --version

      - name: Test and build production bundle
        shell: bash
        run: |
          python -m compileall -q src
          npm --prefix frontend run test
          python scripts/build_sidecar.py
          cargo test --manifest-path frontend/src-tauri/Cargo.toml
          npm --prefix frontend run tauri:build

      - name: Verify, launch, and package candidate
        shell: bash
        run: |
          app_path="$GITHUB_WORKSPACE/frontend/src-tauri/target/release/bundle/macos/keikeu.app"
          main_path="$app_path/Contents/MacOS/keikeu-desktop"
          sidecar_path="$app_path/Contents/MacOS/keikeu-sidecar-aarch64-apple-darwin"
          info_path="$app_path/Contents/Info.plist"
          evidence_path="$RUNNER_TEMP/cp13-evidence.txt"
          archive_path="$RUNNER_TEMP/keikeu-cp13-macos15.7-arm64.zip"

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_path")"
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$info_path")"
          main_file="$(/usr/bin/file "$main_path")"
          sidecar_file="$(/usr/bin/file "$sidecar_path")"
          build_info="$(xcrun vtool -show-build "$main_path")"

          [[ "$bundle_id" == "app.keikeu.desktop" ]]
          [[ "$minimum" == "15.7" ]]
          [[ "$main_file" == *"arm64"* ]]
          [[ "$sidecar_file" == *"arm64"* ]]
          [[ "$build_info" == *"minos 15.7"* ]]

          hello_response="$(
            printf '%s\n' '{"v":1,"id":1,"method":"system.hello","params":{}}' |
              "$sidecar_path"
          )"
          export HELLO_RESPONSE="$hello_response"
          python -c 'import json, os; value = json.loads(os.environ["HELLO_RESPONSE"]); assert value["ok"] and value["result"]["protocol_version"] == 1'

          /usr/bin/open -n "$app_path"
          app_pids=""
          for _ in {1..20}; do
            if app_pids="$(/usr/bin/pgrep -f "$main_path")"; then
              break
            fi
            sleep 0.5
          done
          [[ -n "$app_pids" ]]
          app_pid="${app_pids%%$'\n'*}"
          sleep 10
          /bin/kill -0 "$app_pid"
          sidecar_pids="$(/usr/bin/pgrep -f 'keikeu-sidecar-aarch64-apple-darwin')"
          [[ -n "$sidecar_pids" ]]

          /usr/bin/osascript -e 'tell application id "app.keikeu.desktop" to quit'
          for _ in {1..20}; do
            if ! /bin/kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          if /bin/kill -0 "$app_pid" 2>/dev/null; then
            echo "::error::Host did not exit cleanly"
            /bin/kill -TERM "$app_pid"
            exit 1
          fi
          if lingering="$(/usr/bin/pgrep -f 'keikeu-sidecar-aarch64-apple-darwin')"; then
            echo "::error::Sidecar remained after host exit: $lingering"
            exit 1
          fi

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"
          {
            echo "git_sha=$GITHUB_SHA"
            echo "runner_image=$ImageOS $ImageVersion"
            sw_vers
            uname -m
            node --version
            npm --version
            rustc --version
            cargo --version
            python --version
            python -m PyInstaller --version
            echo "bundle_id=$bundle_id"
            echo "minimum_system_version=$minimum"
            echo "$main_file"
            echo "$sidecar_file"
            echo "$build_info"
            echo "sidecar_hello=passed"
            echo "bundle_launch=passed"
            /usr/bin/shasum -a 256 "$main_path"
            /usr/bin/shasum -a 256 "$sidecar_path"
            /usr/bin/shasum -a 256 "$archive_path"
          } > "$evidence_path"
          cat "$evidence_path"

      - name: Upload candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keikeu-cp13-macos15.7-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/keikeu-cp13-macos15.7-arm64.zip
            ${{ runner.temp }}/cp13-evidence.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
