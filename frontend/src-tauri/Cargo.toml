[package]
name = "keikeu-desktop"
version = "0.1.0"
description = "Local-first keikeu desktop host"
authors = ["keikeu contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "keikeu_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-shell = "=2.3.5"
