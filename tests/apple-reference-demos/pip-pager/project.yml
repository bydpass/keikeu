name: ReferencePiP
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "0.0.1"
    CODE_SIGNING_ALLOWED: NO
targets:
  RefPiP:
    type: application
    platform: iOS
    sources:
      - ../../../apple-reference-demos/Sample.swift
      - ../../../apple-reference-demos/pip-pager/Reader.swift
      - ../../../apple-reference-demos/pip-pager/PiPPager.swift
      - ../../../apple-reference-demos/pip-pager/Icons/PiP.xcassets
    info:
      path: RefPiP-Info.plist
      properties:
        CFBundleDisplayName: Ref PiP
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keikeu.refpip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
