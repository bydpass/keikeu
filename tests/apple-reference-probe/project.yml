name: ReferenceProbe
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.0.1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    CODE_SIGNING_ALLOWED: NO
targets:
  ReferenceProbe:
    type: application
    platform: iOS
    sources: [../../apple-reference-probe/Probe.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keikeu.referenceprobe
        INFOPLIST_KEY_CFBundleDisplayName: Ref Probe
  ReferenceEditor:
    type: application
    platform: iOS
    sources: [../../apple-reference-probe/Editor.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keikeu.referenceeditor
        INFOPLIST_KEY_CFBundleDisplayName: Ref Editor
