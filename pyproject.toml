[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keikeu"
version = "0.1.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
# Required: project name "keikeu" has no matching dir, so hatchling cannot
# auto-detect packages. List them explicitly. The sources remap drops the
# leading "apps/desktop/python/" so they import as top-level packages.
packages = ["apps/desktop/python/keikeu_core", "apps/desktop/python/keikeu_bridge"]

[tool.hatch.build.targets.wheel.sources]
"apps/desktop/python" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/desktop/python"]
addopts = "--basetemp=tests/test-vault/pytest --ignore=tests/test-vault"
